<article class="publication-row">
  <div class="publication-meta"><span class="venue-badge">{{ post.venue }}</span><span>{{ post.date | date: '%Y' }}</span></div>
  <div class="publication-copy"><h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3><p class="publication-authors">{{ post.authors | default: post.Authors }}</p><div class="publication-excerpt">{{ post.excerpt | markdownify }}</div><div class="publication-links"><a class="text-link" href="{{ post.url | relative_url }}">Overview <span aria-hidden="true">↗</span></a>{% if post.paperurl %}<a class="text-link" href="{{ post.paperurl }}">Paper <span aria-hidden="true">↗</span></a>{% endif %}</div></div>
</article>
